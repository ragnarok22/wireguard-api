[project]
name = "wireguard-api"
version = "0.4.2"
description = "WireGuard VPN node with a REST API for peer management"
authors = [
    {name = "Reinier Hernández", email = "sasuke.reinier@gmail.com"},
    {name = "Carlos Lugones", email = "contact@lugodev.com"},
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0,<0.144",
    "uvicorn[standard]>=0.54.0,<0.55",
    "python-dotenv>=1.2.4,<2",
    "pydantic>=2.14.0,<3",
    "prometheus-client>=0.26.0,<0.27",
    "starlette>=1.7.0,<2",
]

[tool.uv]
package = false
required-version = ">=0.12.23"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.per-file-target-version]
# The smoke runner uses the CI host's Python, not the container's interpreter.
"scripts/*.py" = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[dependency-groups]
dev = [
    "ruff>=0.16.10,<0.17",
    "pytest>=9.1.1,<10",
    "httpx2>=2.13.1,<3",
    "pytest-cov>=7.1.0,<8",
    "mypy>=2.4.0,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.14"
files = [
    "api.py", "routes.py", "health.py", "metrics.py", "wireguard.py", "storage.py",
    "storage_lock.py", "legacy.py", "settings.py", "models.py", "service.py",
    "errors.py", "keys.py", "configuration.py", "version.py", "bootstrap.py",
    "scripts/release_metadata.py",
    "stats.py", "cgroups.py", "system_info.py", "telemetry.py",
]
strict = true

[tool.coverage.run]
branch = true
source = [
    "api", "routes", "health", "metrics", "wireguard", "storage", "storage_lock",
    "legacy", "settings", "models", "service", "errors", "keys", "configuration",
    "version", "bootstrap", "scripts.release_metadata",
    "stats", "cgroups", "system_info", "telemetry",
]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 100
