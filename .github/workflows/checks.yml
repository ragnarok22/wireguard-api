name: Project checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: Python quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
      - name: Install dependencies
        run: make install
      - name: Check lint, formatting, and types
        run: make lint format-check typecheck
      - name: Run tests with coverage
        run: make coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  container:
    name: Container checks (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Check Dockerfile
        run: docker build --check .
      - name: Check service shell and Compose configuration
        env:
          API_TOKEN: ci-compose-validation-token
          SERVER_ENDPOINT: node.example.org:51820
        run: |
          sh -n service_run
          docker compose --env-file /dev/null config --quiet
      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: wireguard-api:smoke
          cache-from: type=gha,scope=checks-${{ matrix.runner }}
          cache-to: type=gha,scope=checks-${{ matrix.runner }},mode=max
      - name: Verify authentication, key permissions and bootstrap failures
        run: make bootstrap-check
      - name: Smoke-test WireGuard API and persistence
        run: python3 scripts/smoke_container.py wireguard-api:smoke
      - name: Prepare native v0.4.2 upgrade baseline
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$PLATFORM" = linux/amd64 ]; then
            BASELINE=ragnarok22/wireguard-api@sha256:58e3deafcc1592a67061a3a1aa86f7c87074a33977e8a4d7e3eddc30baeb9503
            docker pull --platform "$PLATFORM" "$BASELINE"
            docker tag "$BASELINE" wireguard-api:baseline-0.4.2
          else
            # v0.4.2 was published for amd64 only. Build its actual release source
            # and original Dockerfile natively; never emulate the lifecycle check.
            git archive --format=tar d4d5bd8a162b8ee57c3dc3bcaeeb57fab5147aae |
              docker build --platform "$PLATFORM" --tag wireguard-api:baseline-0.4.2 -
          fi
      - name: Verify upgrade, backup restoration, crash recovery and rollback
        run: make lifecycle-check
