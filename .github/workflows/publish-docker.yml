name: Publish Docker images and release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  # Serialize every release in this repository, including moving alias updates.
  group: publish-docker
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release version and alias policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      immutable_tag: ${{ steps.release.outputs.immutable_tag }}
      major_tag: ${{ steps.release.outputs.major_tag }}
      minor_tag: ${{ steps.release.outputs.minor_tag }}
      major_enabled: ${{ steps.release.outputs.major_enabled }}
      minor_enabled: ${{ steps.release.outputs.minor_enabled }}
      latest_enabled: ${{ steps.release.outputs.latest_enabled }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      hub_image: ${{ steps.images.outputs.hub_image }}
      ghcr_image: ${{ steps.images.outputs.ghcr_image }}
    steps:
      - name: Checkout repository and all known tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate exact SemVer and project version; select aliases
        id: release
        # Newer known stable tags suppress aliases even if not yet published.
        run: python3 -m scripts.release_metadata >> "$GITHUB_OUTPUT"
      - name: Normalize registry repository names
        id: images
        run: |
          printf 'hub_image=%s\nghcr_image=ghcr.io/%s\n' \
            "${GITHUB_REPOSITORY,,}" "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  checks:
    needs: metadata
    uses: ./.github/workflows/checks.yml

  publish:
    name: Publish to Docker Hub and GHCR
    needs: [metadata, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ needs.metadata.outputs.hub_image }}
            ${{ needs.metadata.outputs.ghcr_image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.metadata.outputs.immutable_tag }}
      - name: Build and push multi-platform images
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=publish
          cache-to: type=gha,scope=publish,mode=max
      - name: Verify the published index exists in both registries
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          HUB_IMAGE: ${{ needs.metadata.outputs.hub_image }}
          GHCR_IMAGE: ${{ needs.metadata.outputs.ghcr_image }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$GHCR_IMAGE@$DIGEST"
          docker buildx imagetools inspect "$HUB_IMAGE@$DIGEST"
          {
            printf '## Published multi-platform index\n\n'
            printf '* GHCR: %s@%s\n' "$GHCR_IMAGE" "$DIGEST"
            printf '* Docker Hub: %s@%s\n' "$HUB_IMAGE" "$DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify published image (${{ matrix.platform }})
    needs: [metadata, publish]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and smoke-test the exact published bytes
        env:
          IMAGE: ${{ needs.metadata.outputs.ghcr_image }}@${{ needs.publish.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker pull --platform "$PLATFORM" "$IMAGE"
          python3 scripts/smoke_container.py "$IMAGE"
          printf '* Published image smoke test passed: %s on %s\n' \
            "$IMAGE" "$PLATFORM" >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Promote verified image to eligible moving aliases
    needs: [metadata, publish, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote eligible aliases using the verified index digest
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          HUB_IMAGE: ${{ needs.metadata.outputs.hub_image }}
          GHCR_IMAGE: ${{ needs.metadata.outputs.ghcr_image }}
          MAJOR_TAG: ${{ needs.metadata.outputs.major_tag }}
          MINOR_TAG: ${{ needs.metadata.outputs.minor_tag }}
          MAJOR_ENABLED: ${{ needs.metadata.outputs.major_enabled }}
          MINOR_ENABLED: ${{ needs.metadata.outputs.minor_enabled }}
          LATEST_ENABLED: ${{ needs.metadata.outputs.latest_enabled }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          aliases=()
          if [[ "$MAJOR_ENABLED" == "true" ]]; then
            aliases+=("$MAJOR_TAG")
          fi
          if [[ "$MINOR_ENABLED" == "true" ]]; then
            aliases+=("$MINOR_TAG")
          fi
          if [[ "$LATEST_ENABLED" == "true" ]]; then
            aliases+=("latest")
          fi
          if (( ${#aliases[@]} == 0 )); then
            printf 'No moving aliases are eligible for this release.\n' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for image in "$GHCR_IMAGE" "$HUB_IMAGE"; do
            for alias in "${aliases[@]}"; do
              # A single index source is carbon-copied without rebuilding.
              docker buildx imagetools create --tag "$image:$alias" "$image@$DIGEST"
              printf '* Promoted %s:%s to verified index %s\n' \
                "$image" "$alias" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
            done
          done

  release:
    needs: [metadata, publish, verify, promote]
    uses: ./.github/workflows/release.yml
    with:
      prerelease: ${{ needs.metadata.outputs.prerelease == 'true' }}
    permissions:
      contents: write
